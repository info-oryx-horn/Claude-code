<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Upkeep{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="brand-mark" src="{{ url_for('static', filename='oryx-horn-logo.png') }}" alt="Oryx Horn logo">
      <div class="brand-text">
        <span class="brand-name">ORYX HORN</span>
        <span class="brand-product">Upkeep</span>
      </div>
    </div>
    {% if g.user %}
      <span class="whoami">{{ g.user['name'] }} &middot; {{ g.user['role']|capitalize }}</span>
      <a class="logout" href="{{ url_for('logout') }}">Log out</a>
    {% endif %}
  </header>

  <main class="content">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">
          {% for message in messages %}<p>{{ message }}</p>{% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
